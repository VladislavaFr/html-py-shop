<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты</title>
    <link href="../css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
    <div class="bg-dark text-white p-3" style="width: 250px; min-height: 100vh;">
        <h4>Меню</h4>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link text-white" href="main.html">Главная</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="catalog.html">Каталог</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="category1.html">Категория</a></li>
            <li class="nav-item"><a class="nav-link active text-white bg-primary" href="contacts.html">Контакты</a></li>
        </ul>
    </div>
    <div class="container p-4">
        <h1>Контакты</h1>
        <form method="post">
            <div class="mb-3">
                <label class="form-label">Имя</label>
                <input type="text" class="form-control" name="name" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Сообщение</label>
                <textarea class="form-control" name="message" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Отправить</button>
        </form>
    </div>
</div>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
